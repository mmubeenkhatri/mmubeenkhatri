<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Muhammad Mubeen — Senior Software Developer">
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363D" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0D1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#accentLine)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#30363D" rx="8"/>

  <text x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1.5" fill="#F0F6FC">MUHAMMAD MUBEEN</text>
  <rect x="64" y="134" width="72" height="4" rx="2" fill="url(#accentLine)"/>
  <text x="64" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="0.6" fill="#C9D1D9">Senior Software Developer · Backend &amp; Full-Stack Engineer</text>
  <text x="64" y="216" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="0.4" fill="#8B949E">Node.js · NestJS · Laravel · TypeScript · Python · AWS</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.6" fill="#8B949E">
    <text x="64" y="262">6+ YEARS</text>
    <text x="168" y="262" fill="#3B82F6">•</text>
    <text x="192" y="262">LEAD DEVELOPER</text>
    <text x="344" y="262" fill="#3B82F6">•</text>
    <text x="368" y="262">FINTECH · HEALTHCARE · AGRI-TECH · E-LEARNING</text>
  </g>
